services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ARSY_ADDR: 0.0.0.0
      ARSY_PORT: "8080"
      RUST_LOG: arsy_server=info
    restart: unless-stopped
    # Add database/redis services here when real adapters replace the
    # in-memory repository.
