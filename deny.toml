# cargo-deny: advisory, license, and source auditing (run via `cargo deny check`)

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[[sources]]
gid = "crates-io"
locator = "https://crates.io"
