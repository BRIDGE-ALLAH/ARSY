[workspace]
resolver = "2"
members = [
    "crates/arsy-core",
    "crates/arsy-infra",
    "crates/arsy-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# internal crates
arsy-core = { path = "crates/arsy-core" }
arsy-infra = { path = "crates/arsy-infra" }

# web stack
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors
thiserror = "2"
anyhow = "1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utilities
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
